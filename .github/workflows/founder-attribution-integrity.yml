name: Founder attribution integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  founder-attribution-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify founder and third-party provenance
        shell: bash
        run: |
          set -euo pipefail
          test -f AUTHORS.md
          test -f README.md
          grep -Fq 'Alexander Nikolaevich Romaskevich' AUTHORS.md
          grep -Fq 'RomaskevicH' AUTHORS.md
          grep -Fq 'Alexander Nikolaevich Romaskevich' README.md
          test -f .github/workflows/founder-attribution-integrity.yml
