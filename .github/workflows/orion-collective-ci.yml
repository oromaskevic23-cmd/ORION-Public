name: ORION Collective Decision CI
on:
  pull_request:
  push:
    branches:
      - main
      - feat/orion-collective-contract-sprint-006
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
