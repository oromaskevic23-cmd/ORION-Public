name: ORION Enterprise — Federated Council
on:
  push:
    branches: [feat/orion-enterprise-runtime-20261027]
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/orion-enterprise.yml'
permissions:
  contents: read
jobs:
  council-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check src/orion-enterprise.mjs
      - run: node --test test/orion-enterprise.test.mjs
